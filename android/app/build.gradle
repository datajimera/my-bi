plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = file('../key.properties')
}
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = file('key.properties')
}
if (keystorePropertiesFile.exists()) {
    try {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    } catch (Exception ignored) {}
}

android {
    namespace "com.smartbilling"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.smartbilling"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [appName: "Smart Billing"]
    }

    signingConfigs {
        release {
            def kPath = keystoreProperties['storeFile'] ?: "upload-keystore.jks"
            def kFile = file(kPath)
            if (!kFile.exists()) kFile = file("upload-keystore.jks")
            if (!kFile.exists()) kFile = rootProject.file("app/upload-keystore.jks")
            if (!kFile.exists()) kFile = rootProject.file("upload-keystore.jks")

            def sPass = keystoreProperties['storePassword']
            def kPass = keystoreProperties['keyPassword']
            def kAlias = keystoreProperties['keyAlias']

            // Only use custom keystore if the file actually exists, is not empty (>300 bytes), and has valid password
            if (kFile != null && kFile.exists() && kFile.length() > 300 && sPass != null && !sPass.toString().trim().isEmpty()) {
                storeFile kFile
                storePassword sPass.toString().trim()
                keyAlias (kAlias != null && !kAlias.toString().trim().isEmpty() ? kAlias.toString().trim() : "upload")
                keyPassword (kPass != null && !kPass.toString().trim().isEmpty() ? kPass.toString().trim() : sPass.toString().trim())
            }
        }
    }

    flavorDimensions "default"

    productFlavors {
        counter {
            dimension "default"
            applicationId "com.smartbilling.counter"
            manifestPlaceholders = [appName: "Billing Counter"]
        }
        manager {
            dimension "default"
            applicationId "com.smartbilling.manager"
            manifestPlaceholders = [appName: "Billing Manager"]
        }
        checking {
            dimension "default"
            applicationId "com.smartbilling.checking"
            manifestPlaceholders = [appName: "Exit Checking"]
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists() && signingConfigs.release.storeFile.length() > 300) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
