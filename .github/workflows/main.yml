name: Build 3 Android Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [counter, manager, checking]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter & Android Local Properties
        run: |
          mkdir -p android/app
          FLUTTER_PATH=$(dirname $(dirname $(which flutter)))
          echo "Flutter SDK Path: $FLUTTER_PATH"
          echo "flutter.sdk=$FLUTTER_PATH" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          flutter config --no-analytics

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from GitHub Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          else
            echo "Generating release build keystore..."
            keytool -genkey -v -keystore android/app/upload-keystore.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=SmartBilling, OU=Retail, O=Store, L=City, S=State, C=IN"
            STORE_PASS="android"
            KEY_PASS="android"
            KEY_ALIAS="upload"
          fi

          cat > android/key.properties <<EOF
          storePassword=${STORE_PASS:-android}
          keyPassword=${KEY_PASS:-android}
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK (${{ matrix.flavor }})
        run: |
          flutter build apk --release \
            --flavor ${{ matrix.flavor }} \
            -t lib/main_${{ matrix.flavor }}.dart \
            --build-number=${{ github.run_number }}

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          APK_FOUND=$(find build -name "*${{ matrix.flavor }}*release*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find build -name "*release*.apk" | head -n 1)
          fi
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find build -name "*.apk" | head -n 1)
          fi
          echo "Found build APK: $APK_FOUND"
          cp "$APK_FOUND" "dist/billing-${{ matrix.flavor }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-${{ matrix.flavor }}-apk
          path: dist/billing-${{ matrix.flavor }}.apk
          if-no-files-found: error
