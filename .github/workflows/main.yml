name: Build 3 Android Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [counter, manager, checking]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Flutter & Android Environment
        run: |
          mkdir -p android/app
          FLUTTER_PATH=$(dirname $(dirname $(which flutter)))
          echo "Flutter SDK Path: $FLUTTER_PATH"
          echo "flutter.sdk=$FLUTTER_PATH" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          flutter config --no-analytics

          # Accept all Android SDK licenses to prevent sdkmanager failure
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63cbd82ea12e1d73f33a17d494f10424" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (${{ matrix.flavor }})
        run: |
          flutter build apk --release \
            --flavor ${{ matrix.flavor }} \
            -t lib/main_${{ matrix.flavor }}.dart \
            --build-number=${{ github.run_number }} \
            --android-skip-build-dependency-validation \
            --verbose

      - name: Locate and Prepare Artifact
        run: |
          mkdir -p dist
          echo "=== Searching for generated APK files ==="
          find build -type f -name "*.apk" || true
          APK_FILE=$(find build -type f -name "*${{ matrix.flavor }}*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build -type f -name "*release*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build -type f -name "*.apk" | head -n 1)
          fi
          echo "Selected APK: $APK_FILE"
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "dist/billing-${{ matrix.flavor }}.apk"
          else
            echo "ERROR: No APK was generated!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: billing-${{ matrix.flavor }}-apk
          path: dist/billing-${{ matrix.flavor }}.apk
          if-no-files-found: error
