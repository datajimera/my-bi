plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.smartbilling"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.smartbilling"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [appName: "Smart Billing"]
    }

    flavorDimensions "default"

    productFlavors {
        counter {
            dimension "default"
            applicationId "com.smartbilling.counter"
            manifestPlaceholders = [appName: "Billing Counter"]
        }
        manager {
            dimension "default"
            applicationId "com.smartbilling.manager"
            manifestPlaceholders = [appName: "Billing Manager"]
        }
        checking {
            dimension "default"
            applicationId "com.smartbilling.checking"
            manifestPlaceholders = [appName: "Exit Checking"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
